name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    name: Plan test jobs
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Select every test file
        id: suites
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readdirSync } from "node:fs";
          // Seam (deferred): repository-owned CI grouping; consumers: 1; extract at 3.
          const repository = "test/repository-wide-rules.test.mjs";
          const suites = [
            { name: "fresh profiles", files: [repository], pattern: "^(?!public CLI)|: (standard|factory|factory-policy|node)$" },
            { name: "fresh web stacks", files: [repository], pattern: ": (astro|vite)-(standard|factory)$" },
            { name: "web stack updates", files: [repository], pattern: ": (astro|vite)-(standard|factory)-update$" },
            { name: "legacy updates", files: [repository], pattern: ": (standard|factory)-update$" },
            { name: "source updates", files: [repository], pattern: ": (source-update|factory-both-update|source-unknown-update)$" },
            { name: "orchestrate updates", files: [repository], pattern: ": (edited-update|standard-orchestrate-update|factory-orchestrate-update)$" },
            { name: "release updates", files: [repository], pattern: ": (standard|factory)-release-update$" },
            ...["validator-layout", "check-locations", "check-location-updates"].map(name => ({
              name, files: [`test/${name}.test.mjs`], pattern: ".",
            })),
          ];
          const assigned = new Set(suites.flatMap(suite => suite.files));
          suites.push({
            name: "remaining tests", pattern: ".",
            files: readdirSync("test").filter(name => name.endsWith(".test.mjs"))
              .map(name => `test/${name}`).filter(file => !assigned.has(file)).sort(),
          });
          for (const suite of suites) console.log(`${suite.name}: ${suite.files.join(" ")} [${suite.pattern}]`);
          appendFileSync(process.env.GITHUB_OUTPUT, `suites=${JSON.stringify(suites)}\n`);
          NODE

  node:
    name: Node.js ${{ matrix.node }} / ${{ matrix.suite.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Use pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install development dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the public CLI once for this job
        env:
          REPO_STANDARDS_PREFIX: ${{ runner.temp }}/repo-standards-cli-11.0.0
        run: |
          echo "REPO_STANDARDS_PREFIX=$REPO_STANDARDS_PREFIX" >> "$GITHUB_ENV"
          npm install --prefix "$REPO_STANDARDS_PREFIX" --ignore-scripts \
            --registry=https://registry.npmjs.org \
            @lutzseverino/repo-standards@11.0.0
          "$REPO_STANDARDS_PREFIX/node_modules/.bin/repo-standards" --version
      - name: Format, lint, syntax check and typecheck
        if: matrix.suite.name == 'remaining tests'
        run: pnpm run format:check && pnpm run lint && pnpm run check && pnpm run typecheck
      - name: Run selected tests
        env:
          TEST_FILES: ${{ join(matrix.suite.files, ' ') }}
          TEST_PATTERN: ${{ matrix.suite.pattern }}
        run: |
          read -r -a files <<< "$TEST_FILES"
          printf 'Selected test file: %s\n' "${files[@]}"
          node --test --test-name-pattern="$TEST_PATTERN" "${files[@]}"
      - name: Validate the complete standards source
        if: matrix.suite.name == 'remaining tests'
        run: |
          "$REPO_STANDARDS_PREFIX/node_modules/.bin/repo-standards" \
            source validate "$PWD" --json

  # The one required check, whatever the Node.js matrix holds.
  test:
    name: Test
    needs: [plan, node]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every planned job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "A required job finished with result: $result" >&2
              exit 1
            fi
          done
