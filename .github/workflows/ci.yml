name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install development dependencies
        run: npm ci --include=dev
      - name: Check formatting
        run: npm run format:check
      - name: Lint authored files
        run: npm run lint
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run test suite
        run: npm test
      - name: Validate the complete standards source
        env:
          REPO_STANDARDS_PREFIX: ${{ runner.temp }}/repo-standards-cli-6.0.0
        run: |
          npm install --prefix "$REPO_STANDARDS_PREFIX" --ignore-scripts \
            --registry=https://registry.npmjs.org \
            @lutzseverino/repo-standards@6.0.0
          "$REPO_STANDARDS_PREFIX/node_modules/.bin/repo-standards" --version
          "$REPO_STANDARDS_PREFIX/node_modules/.bin/repo-standards" \
            source validate "$PWD" --json

  factory:
    name: Factory typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factory
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install factory dependencies
        run: npm ci --include=dev
      - name: Typecheck factory
        run: npm run typecheck
      - name: Run factory tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm test
