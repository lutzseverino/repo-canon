name: Read-set budget

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  read-set:
    name: Read set
    runs-on: ubuntu-latest
    steps:
      - name: Check out the head computation and repository history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - name: Use Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install development dependencies
        run: pnpm install --frozen-lockfile
      - name: Compare every entry point with the pull request base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          writeFileSync(`${process.env.RUNNER_TEMP}/read-set-body.md`, event.pull_request.body ?? '');
          JS
          node scripts/read-set.mjs compare "$BASE_SHA" --description "$RUNNER_TEMP/read-set-body.md"
